name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'ios/**'
      - 'android/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: mobile

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        id: cache
        with:
          path: mobile/node_modules
          key: node-modules-${{ hashFiles('mobile/package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-modules-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm run lint

  test-js:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-modules-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm test -- --ci

  # ---------------------------------------------------------------------------
  # iOS: prebuild then xcodebuild for simulator
  # Runs on ios/** branches and PRs targeting main/develop
  # ---------------------------------------------------------------------------
  build-ios-sim:
    if: github.event_name != 'push' || contains(github.ref, 'ios/')
    runs-on: macos-latest
    needs: install
    strategy:
      matrix:
        device: ["iPhone 15", "iPhone 14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - name: Expo prebuild (generates ios/ and android/)
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build iOS simulator
        # Signing disabled for simulator CI builds.
        # Inject Apple credentials only in release.yml via GitHub Environments.
        run: |
          xcodebuild \
            -workspace ios/OpenFlight.xcworkspace \
            -scheme OpenFlight \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs-${{ strategy.job-index }}
          path: /tmp/xcodebuild_*.log

  unit-tests-ios:
    if: github.event_name != 'push' || contains(github.ref, 'ios/')
    runs-on: macos-latest
    needs: build-ios-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: cd ios && pod install
      - name: Run iOS XCTests
        run: |
          xcodebuild test \
            -workspace ios/OpenFlight.xcworkspace \
            -scheme OpenFlight \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

  swiftlint:
    if: github.event_name != 'push' || contains(github.ref, 'ios/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: npx expo prebuild --platform ios --clean --no-install
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: swiftlint lint ios/ --reporter github-actions-logging

  # ---------------------------------------------------------------------------
  # Android: prebuild then Gradle debug build
  # Runs on android/** branches and PRs targeting main/develop
  # ---------------------------------------------------------------------------
  build-android-debug:
    if: github.event_name != 'push' || contains(github.ref, 'android/')
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        api-level: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Expo prebuild (generates android/)
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build Android debug
        # Release builds require keystore — use CI secrets in release.yml.
        # Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (GitHub → Settings → Secrets).
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-api${{ matrix.api-level }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  unit-tests-android:
    if: github.event_name != 'push' || contains(github.ref, 'android/')
    runs-on: ubuntu-latest
    needs: build-android-debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --clean --no-install
      - run: cd android && ./gradlew test --no-daemon

  ktlint:
    if: github.event_name != 'push' || contains(github.ref, 'android/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: npx expo prebuild --platform android --clean --no-install
      - run: cd android && ./gradlew ktlintCheck --no-daemon

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  security-scan:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-modules-${{ hashFiles('mobile/package-lock.json') }}
      - name: Audit JS dependencies
        run: npm audit --audit-level=high || true
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
